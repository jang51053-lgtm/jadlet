<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadlet</title>
<style>
  :root {
    --bg: #6b5548; --bg-deep: #5a4639;
    --panel: rgba(0,0,0,.22); --panel-hover: rgba(0,0,0,.32);
    --chip: rgba(255,255,255,.10); --chip-hover: rgba(255,255,255,.18);
    --text: #f5efe9; --text-dim: rgba(245,239,233,.65);
    --yellow: #ffe83d; --yellow-text: #2b2410;
    --card: #ffffff; --card-text: #1f1a17; --card-dim: #7a716b; --card-line: rgba(0,0,0,.08); --card-ui: rgba(0,0,0,.06);
    --radius: 12px; --shadow: 0 6px 18px rgba(0,0,0,.25);
    --ui: #f3f3f5; --ui-hover: #e8e8ec; --ui2: #e9e9ee;
    --purple: #a78bfa; --purple-deep: #8b5cf6;
    --pw: 284px;
  }
  :root.dark { --card: #2a2321; --card-text: #f3ede7; --card-dim: #a89e96; --card-line: rgba(255,255,255,.1); --card-ui: rgba(255,255,255,.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; position: relative;
    background-size: cover; background-position: center;
  }
  body::after { content: ""; position: fixed; right: -140px; bottom: -260px; width: 720px; height: 720px; border-radius: 50%; background: var(--bg-deep); pointer-events: none; z-index: 0; }
  body.has-image::after { display: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  input, textarea, select { font: inherit; }
  svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Top bar ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 20; }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -.5px; opacity: .9; }
  .status { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--chip); color: var(--text-dim); white-space: nowrap; }
  .status.live { color: #7CFC9B; } .status.off { color: #ffb4a2; } .status:empty { display: none; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .search { display: flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 18px; height: 36px; padding: 0 12px; width: 80px; transition: width .2s; }
  .search:focus-within { width: 220px; background: var(--chip-hover); }
  .search input { background: none; border: 0; outline: 0; color: var(--text); width: 100%; }
  .search input::placeholder { color: var(--text-dim); }
  .chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 18px; height: 36px; padding: 0 14px; font-weight: 700; font-size: 14px; transition: background .15s; }
  .chip:hover { background: var(--chip-hover); }
  .icon-group { display: flex; align-items: center; background: var(--chip); border-radius: 18px; height: 36px; padding: 0 4px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--chip-hover); }
  .icon-group .sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #ffd166, #ef476f); display: grid; place-items: center; font-size: 16px; margin-left: 4px; }

  /* ---------- Board ---------- */
  .board-header { position: fixed; top: 62px; left: 80px; z-index: 10; max-width: 60vw; }
  .board-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .board-title-row { display: flex; align-items: center; gap: 8px; }
  .board-icon { font-size: 26px; line-height: 1; }
  .board-title { font-size: 26px; font-weight: 800; outline: 0; border-radius: 6px; padding: 2px 4px; margin-left: -4px; min-width: 120px; }
  .board-title:focus { background: rgba(255,255,255,.08); }
  .board-desc { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
  .board { position: absolute; inset: 0; padding: 150px 40px 100px; overflow: auto; z-index: 1; }
  .sections { display: flex; gap: 40px; align-items: flex-start; justify-content: center; min-width: max-content; margin: 0 auto; }
  .section { width: var(--pw); flex: none; }
  .section-head { display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-radius: 8px; height: 46px; padding: 0 6px 0 12px; margin-bottom: 8px; }
  .section-head.over { background: var(--panel-hover); }
  .section-name { font-size: 20px; font-weight: 800; outline: 0; flex: 1; border-radius: 4px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .section-name:focus { background: rgba(255,255,255,.1); white-space: normal; }
  .section-add { width: 100%; height: 40px; background: var(--panel); border-radius: 8px; display: grid; place-items: center; margin-bottom: 12px; transition: background .15s; }
  .section-add:hover { background: var(--panel-hover); }
  .section-add svg { width: 20px; height: 20px; opacity: .8; }
  .posts { display: flex; flex-direction: column; gap: 12px; min-height: 20px; }
  .posts.over { outline: 2px dashed rgba(255,255,255,.35); outline-offset: 6px; border-radius: 8px; }
  .new-section { white-space: nowrap; background: var(--chip); border-radius: 18px; height: 36px; padding: 0 14px; font-weight: 700; font-size: 14px; flex: none; margin-top: 5px; }
  .new-section:hover { background: var(--chip-hover); }
  /* 다른 레이아웃 */
  .flow { margin: 0 auto; }
  .flow.layout-wall { columns: var(--pw); column-gap: 16px; max-width: 1400px; }
  .flow.layout-wall .post { break-inside: avoid; margin-bottom: 16px; }
  .flow.layout-grid { display: grid; grid-template-columns: repeat(auto-fill, var(--pw)); gap: 16px; justify-content: center; align-items: start; }
  .flow.layout-stream { display: flex; flex-direction: column; gap: 16px; max-width: 600px; }
  .flow .sec-tag { font-size: 11px; color: var(--card-dim); padding: 8px 14px 0; }

  /* ---------- Post card ---------- */
  .post { background: var(--card); color: var(--card-text); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: grab; position: relative; border-top: 6px solid transparent; }
  .post[draggable="false"] { cursor: default; }
  .post.dragging { opacity: .4; }
  .post.drop-before { box-shadow: 0 -4px 0 var(--yellow), var(--shadow); }
  .post.pending { outline: 2px dashed var(--yellow); }
  .post.noselect { user-select: none; }
  .pending-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(255,232,61,.25); font-size: 12px; font-weight: 700; }
  .pending-bar button { margin-left: auto; background: var(--yellow); color: var(--yellow-text); border-radius: 12px; padding: 3px 10px; font-size: 12px; }
  .pending-bar button.rej { background: none; color: #d62828; margin-left: 0; }
  .post-body { padding: 12px 14px; }
  .post-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; word-break: break-word; }
  .post-text { font-size: 14px; line-height: 1.5; color: var(--card-text); opacity: .85; white-space: pre-wrap; word-break: break-word; }
  .post-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 10px 14px; font-size: 12px; color: var(--card-dim); }
  .post-actions { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
  .post-actions button { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 14px; font-size: 12px; color: var(--card-dim); }
  .post-actions button:hover { background: var(--card-ui); color: var(--card-text); }
  .post-actions button.liked { color: #e63946; }
  .post-actions button.liked svg { fill: #e63946; stroke: #e63946; }
  .post-actions button.mine { background: var(--card-ui); color: var(--card-text); font-weight: 700; }
  .post-actions svg { width: 15px; height: 15px; }
  .post-menu-btn { position: absolute; top: 10px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.85); color: #444; display: grid; place-items: center; opacity: 0; transition: opacity .15s; z-index: 2; }
  .post:hover .post-menu-btn { opacity: 1; }
  .post-menu-btn:hover { background: #fff; }
  .comments { border-top: 1px solid var(--card-line); padding: 10px 14px; display: none; }
  .comments.open { display: block; }
  .comment { font-size: 13px; margin-bottom: 8px; line-height: 1.4; }
  .comment b { margin-right: 6px; }
  .comment .ts { color: var(--card-dim); font-size: 11px; margin-left: 6px; }
  .comment-form { display: flex; gap: 6px; margin-top: 8px; }
  .comment-form input { flex: 1; border: 1px solid var(--card-line); border-radius: 14px; padding: 6px 10px; outline: 0; font-size: 13px; background: transparent; color: var(--card-text); }
  .comment-form input:focus { border-color: #999; }
  .comment-form button { background: var(--card-ui); border-radius: 14px; padding: 0 10px; font-size: 12px; font-weight: 700; }

  /* ---------- Attachment rendering ---------- */
  .att { position: relative; }
  .att img, .att video { display: block; width: 100%; max-height: 300px; object-fit: cover; background: #000; }
  .att audio { display: block; width: 100%; padding: 12px 14px 0; }
  .att iframe { display: block; width: 100%; border: 0; }
  .att-embed { aspect-ratio: 16/9; }
  .att-embed iframe { height: 100%; }
  .att-spotify iframe { height: 152px; }
  .att-map iframe { height: 200px; }
  .yt img { height: 100%; object-fit: cover; }
  .yt-play { position: absolute; inset: 0; margin: auto; width: 64px; height: 44px; border-radius: 12px; background: rgba(230,33,23,.92); color: #fff; display: grid; place-items: center; }
  .yt-play svg { width: 28px; height: 28px; fill: #fff; stroke: none; }
  .yt-play:hover { background: #e62117; }
  .att-caption { font-size: 12px; color: var(--card-dim); padding: 8px 14px 0; display: flex; gap: 6px; align-items: center; }
  .att-caption a { color: var(--card-dim); text-decoration: none; }
  .att-caption a:hover { text-decoration: underline; }
  .att-link, .att-file { display: flex; align-items: center; gap: 10px; margin: 12px 14px 0; padding: 10px 12px; border: 1px solid var(--card-line); border-radius: 10px; text-decoration: none; color: inherit; font-size: 13px; background: var(--card-ui); }
  .att-link img { width: 20px; height: 20px; max-height: none; object-fit: contain; background: none; flex: none; }
  .att-link .u, .att-file .u { overflow: hidden; }
  .att-link .u b, .att-file .u b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att-link .u span, .att-file .u span { color: var(--card-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .att-file .ic { width: 36px; height: 36px; border-radius: 8px; background: #e9e4ff; display: grid; place-items: center; color: #6b46c1; flex: none; }
  .poll { padding: 12px 14px 0; display: flex; flex-direction: column; gap: 6px; }
  .poll-opt { position: relative; text-align: left; border: 1px solid var(--card-line); border-radius: 8px; padding: 8px 10px; font-size: 13px; overflow: hidden; }
  .poll-opt .bar { position: absolute; inset: 0; background: rgba(255, 232, 61, .45); transform-origin: left; z-index: 0; }
  .poll-opt .lbl { position: relative; z-index: 1; display: flex; justify-content: space-between; }
  .poll-opt.mine { border-color: #b8a100; font-weight: 700; }
  .poll-total { font-size: 11px; color: var(--card-dim); }

  /* ---------- FAB / mini ---------- */
  .fab { position: fixed; right: 24px; bottom: 24px; z-index: 20; background: var(--yellow); color: var(--yellow-text); border-radius: 32px; height: 64px; padding: 0 26px 0 22px; display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: transform .15s; }
  .fab:hover { transform: scale(1.04); }
  .fab svg { width: 24px; height: 24px; stroke-width: 2.5; }
  .mini-bar { position: fixed; right: 24px; bottom: 100px; z-index: 20; background: #fff; color: #222; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); display: none; align-items: center; gap: 10px; }
  .mini-bar.show { display: flex; }
  .mini-bar button { background: var(--ui); border-radius: 8px; padding: 4px 10px; font-size: 12px; }

  /* ---------- Popover menu ---------- */
  .menu { position: fixed; z-index: 80; background: #fff; color: #222; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 6px; min-width: 160px; display: none; }
  .menu.open { display: block; }
  .menu.row { display: flex; min-width: 0; }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 12px; border-radius: 6px; font-size: 14px; white-space: nowrap; }
  .menu.row button { width: auto; font-size: 20px; padding: 6px 8px; }
  .menu button:hover { background: var(--ui); }
  .menu button.danger { color: #d62828; }
  .menu button.on { background: #f3eefe; color: #6d28d9; font-weight: 700; }
  .menu hr { border: 0; border-top: 1px solid #eee; margin: 4px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); display: inline-block; flex: none; }

  /* ---------- Overlay / modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #fff; color: #222; border-radius: 16px; width: 460px; max-width: calc(100% - 32px); max-height: calc(100% - 48px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #eee; font-weight: 800; font-size: 16px; }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .modal input[type=text], .modal input[type=password], .modal textarea, .modal select { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; outline: 0; }
  .modal input:focus, .modal textarea:focus { border-color: #888; }
  .modal label { font-size: 12px; font-weight: 700; color: #666; display: block; margin-bottom: 4px; }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .color { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color.selected { border-color: #222; box-shadow: 0 0 0 2px #fff inset; }
  .btn { padding: 9px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; }
  .btn.ghost { background: var(--ui); }
  .btn.ghost:hover { background: var(--ui-hover); }
  .btn.primary { background: var(--yellow); color: var(--yellow-text); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.primary:disabled { background: #eee; color: #aaa; filter: none; }
  .btn.dark { background: #222; color: #fff; }
  .btn.red { background: #e63946; color: #fff; }
  .code { background: #f5f5f7; border-radius: 8px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; word-break: break-all; white-space: pre-wrap; }

  /* ---------- Composer ---------- */
  .composer { background: #fff; color: #222; border-radius: 20px; width: 460px; max-width: calc(100% - 32px); height: 620px; max-height: calc(100% - 48px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden; transition: width .2s, height .2s; }
  .composer.full { width: calc(100% - 32px); height: calc(100% - 32px); }
  .c-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .c-top > div { display: flex; gap: 8px; align-items: center; }
  .c-sq { width: 44px; height: 44px; border-radius: 10px; background: var(--ui); display: grid; place-items: center; color: #444; }
  .c-sq:hover { background: var(--ui-hover); }
  .c-sq svg { width: 20px; height: 20px; }
  .c-post { height: 44px; padding: 0 20px; border-radius: 10px; background: var(--ui); font-weight: 800; font-size: 16px; color: #bbb; }
  .c-post:not(:disabled) { background: var(--yellow); color: var(--yellow-text); }
  .c-scroll { flex: 1; overflow: auto; padding: 0 16px 16px; }
  .c-title { width: 100%; border: 0; outline: 0; font-size: 22px; font-weight: 800; padding: 10px 8px; }
  .c-title::placeholder { color: #c9c9cf; }
  .c-strip { display: flex; border: 1px dashed #d8d8de; border-radius: 12px; overflow: hidden; height: 180px; margin: 4px 0 0; background: repeating-linear-gradient(135deg, #fff 0 10px, #f5f5f8 10px 11px); }
  .c-strip button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #666; font-size: 13px; font-weight: 700; }
  .c-strip button:nth-child(even) { background: rgba(0,0,0,.025); }
  .c-strip button:hover { background: rgba(0,0,0,.06); color: #222; }
  .c-strip button svg { width: 24px; height: 24px; stroke-width: 1.7; }
  .c-strip .all { background: #f0f0f4; flex: 1.2; }
  .c-hint { font-size: 12px; color: #999; padding: 8px 8px 0; }
  .c-body { width: 100%; border: 0; outline: 0; resize: none; font-size: 17px; line-height: 1.5; padding: 16px 8px; min-height: 160px; }
  .c-body::placeholder { color: #c9c9cf; }
  .c-preview { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5ea; margin-top: 4px; display: none; background: #fff; color: #222; --card-text: #222; --card-dim: #777; --card-line: rgba(0,0,0,.08); --card-ui: rgba(0,0,0,.05); }
  .c-preview.show { display: block; }
  .c-preview .att-link, .c-preview .att-file, .c-preview .poll, .c-preview audio { margin-bottom: 12px; }
  .c-preview .rm { position: absolute; top: 8px; right: 8px; z-index: 3; background: rgba(0,0,0,.65); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; }
  .c-bottom { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid #f0f0f0; }
  .c-bottom button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #444; }
  .c-bottom button:hover { background: var(--ui); }
  .c-bottom svg { width: 14px; height: 14px; }

  /* ---------- Tools panel ---------- */
  .tools-box { background: #fff; color: #222; border-radius: 20px; width: 800px; max-width: calc(100% - 32px); max-height: calc(100% - 48px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.45); padding: 16px; }
  .tools-top { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .tools-top .c-sq { background: none; }
  .tools-top input { flex: 1; border: 2px solid var(--purple); border-radius: 10px; padding: 10px 14px; outline: 0; font-size: 15px; }
  .tools-top input::placeholder { color: #bbb; }
  .tools-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
  .tool { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-align: left; transition: filter .15s; }
  .tool:hover { filter: brightness(.96); }
  .tool.off { opacity: .4; cursor: not-allowed; }
  .tool .ic { width: 26px; height: 26px; display: grid; place-items: center; }
  .tool .ic svg { width: 20px; height: 20px; stroke-width: 1.8; }
  .tool .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool .badge { margin-left: auto; font-size: 11px; font-weight: 700; color: #fff; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
  .g-purple { background: #f3eefe; } .g-purple .ic { color: #7c3aed; } .g-purple .badge { background: #7c3aed; }
  .g-blue   { background: #e9f4fe; } .g-blue .ic { color: #1d6fd6; } .g-blue .badge { background: #1d6fd6; }
  .g-green  { background: #eaf8ec; } .g-green .ic { color: #1f9d55; } .g-green .badge { background: #1f9d55; }
  .g-orange { background: #fef1e9; } .g-orange .ic { color: #e2702a; } .g-orange .badge { background: #e2702a; }
  @media (max-width: 760px) { .tools-group { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- Tool sub-panels ---------- */
  .tp-video { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 10px; object-fit: cover; }
  .tp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tp-row input[type=text] { flex: 1; width: auto; }
  .tp-note { font-size: 12px; color: #888; }
  .tp-rec { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #e63946; font-weight: 700; }
  .tp-rec::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #e63946; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .tp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tp-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; background: #eee; }
  .tp-grid img:hover { outline: 3px solid var(--yellow); }
  .tp-list button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .tp-list button:hover { background: var(--ui); }
  .tp-canvas { width: 100%; aspect-ratio: 4/3; border: 1px solid #ddd; border-radius: 10px; touch-action: none; cursor: crosshair; background: #fff; }
  .tp-poll-opt { display: flex; gap: 6px; }
  .tp-poll-opt button { background: var(--ui); border-radius: 8px; width: 40px; flex: none; }
  .tp-upload { border: 2px dashed #ccc; border-radius: 12px; padding: 40px 20px; text-align: center; color: #666; cursor: pointer; }

<script>
/* =====================================================================
 *  Storage 레이어
 *  - 공통 인터페이스: init(onRemoteChange) → 초기 상태 | null
 *                    save(state) → true | 'quota' | 'disabled' | 'error'
 *                    uploadFile(dataUrl, name, mime) → 저장 가능한 src
 *  - FIREBASE_CONFIG 가 있으면 FirebaseStore(실시간 공유), 없거나 ?local=1 이면 LocalStore
 * ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCUkHgdrmsP6-rzhW26j1S6IVhzP_bQ7XI",
  authDomain: "hakmin-life.firebaseapp.com",
  projectId: "hakmin-life",
  storageBucket: "hakmin-life.firebasestorage.app",
  messagingSenderId: "577095439891",
  appId: "1:577095439891:web:60c6998c0734718d3891e6",
};
const FB_VER = '10.14.1';
const BOARD_ID = (new URLSearchParams(location.search).get('b') || 'main').replace(/[^\w-]/g, '').slice(0, 40) || 'main';
const INLINE_LIMIT = 900 * 1024;      // Firestore 문서 1MB 제한 → 인라인 첨부 상한
const clean = (o) => JSON.parse(JSON.stringify(o));  // undefined 제거 (Firestore가 거부함)

/* 이미지 축소: 긴 변 max px, JPEG 품질 q */
function shrinkImage(dataUrl, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const r = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    im.onerror = rej; im.src = dataUrl;
  });
}

class LocalStore {
  constructor(key) { this.key = key; this.realtime = false; }
  async init() { try { return JSON.parse(localStorage.getItem(this.key) || localStorage.getItem('padlet-clone-v1')) || null; } catch { return null; } }
  remember() {}
  async save(state) {
    try { localStorage.setItem(this.key, JSON.stringify(state)); return true; }
    catch (e) { console.warn('저장 실패', e); return e.name === 'QuotaExceededError' ? 'quota' : 'disabled'; }
  }
  async uploadFile(dataUrl) { return dataUrl; }
}

class FirebaseStore {
  constructor(cfg, boardId) { this.cfg = cfg; this.boardId = boardId; this.realtime = true; this.lastMeta = null; this.lastPosts = new Map(); this.board = null; this.posts = []; }
  async init(onChange) {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [{ initializeApp }, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
    this.fs = fs; this.app = initializeApp(this.cfg); this.db = fs.getFirestore(this.app);
    this.boardRef = fs.doc(this.db, 'boards', this.boardId);
    this.postsRef = fs.collection(this.boardRef, 'posts');
    import(base + 'firebase-storage.js').then((st) => {
      this.st = st; this.storage = st.getStorage(this.app);
      this.storage.maxUploadRetryTime = 8000; this.storage.maxOperationRetryTime = 8000;   // 미설정 버킷이면 빨리 포기하고 인라인 폴백
    }).catch(() => {});

    return new Promise((resolve, reject) => {
      let gotB = false, gotP = false, resolved = false;
      const snapshot = () => this.board ? { ...this.board, posts: this.posts } : null;
      const emit = () => {
        if (!resolved) { if (gotB && gotP) { resolved = true; clearTimeout(timer); resolve(snapshot()); } }
        else onChange(snapshot());
      };
      const fail = (e) => { console.error('Firestore', e); if (!resolved) { resolved = true; reject(e); } else toast('실시간 연결이 끊겼어요: ' + e.code); };
      const timer = setTimeout(() => fail(Object.assign(new Error('timeout'), { code: '연결 시간 초과' })), 12000);
      fs.onSnapshot(this.boardRef, (s) => { this.board = s.exists() ? s.data() : null; gotB = true; emit(); }, fail);
      fs.onSnapshot(this.postsRef, (s) => { this.posts = s.docs.map((d) => d.data()); gotP = true; emit(); }, fail);
    });
  }
  /* 서버에서 받은(또는 방금 저장한) 상태를 기억해 두고, save()에서는 바뀐 문서만 씀 */
  remember(state) {
    const { posts, ...meta } = state;
    this.lastMeta = JSON.stringify(clean(meta));
    this.lastPosts = new Map(posts.map((p) => [p.id, JSON.stringify(clean(p))]));
  }
  async save(state) {
    const fs = this.fs, batch = fs.writeBatch(this.db);
    const { posts, ...meta } = state;
    const metaC = clean(meta), metaJ = JSON.stringify(metaC);
    let n = 0;
    if (metaJ !== this.lastMeta) { batch.set(this.boardRef, metaC); this.lastMeta = metaJ; n++; }
    const seen = new Set();
    for (const p of posts) {
      const c = clean(p), j = JSON.stringify(c); seen.add(p.id);
      if (this.lastPosts.get(p.id) !== j) { batch.set(fs.doc(this.postsRef, p.id), c); this.lastPosts.set(p.id, j); n++; }
    }
    for (const id of [...this.lastPosts.keys()]) if (!seen.has(id)) { batch.delete(fs.doc(this.postsRef, id)); this.lastPosts.delete(id); n++; }
    if (!n) return true;
    try { await batch.commit(); return true; }
    catch (e) { console.error('save', e); toast('저장 실패: ' + (e.code === 'permission-denied' ? 'Firestore 규칙에서 쓰기를 허용해주세요' : e.message)); return 'error'; }
  }
  /* 첨부 업로드: Storage → (실패 시) 이미지 압축 인라인 → 크기 초과면 에러 */
  async uploadFile(dataUrl, name = 'file', mime = '') {
    if (!dataUrl.startsWith('data:')) return dataUrl;
    if (this.storage) {
      try {
        const ref = this.st.ref(this.storage, `boards/${this.boardId}/${Date.now()}-${name.replace(/[^\w.-]/g, '_')}`);
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('storage-timeout')), 15000));
        await Promise.race([this.st.uploadString(ref, dataUrl, 'data_url'), timeout]);
        return await Promise.race([this.st.getDownloadURL(ref), timeout]);
      } catch (e) { console.warn('Storage 업로드 실패 → 인라인 시도', e.code || e.message); this.storage = null; }
    }
    let src = dataUrl;
    if (mime.startsWith('image/') || dataUrl.startsWith('data:image/')) {
      for (const [max, q] of [[1280, 0.8], [960, 0.7], [640, 0.6]]) { if (src.length < INLINE_LIMIT) break; src = await shrinkImage(dataUrl, max, q); }
    }
    if (src.length > INLINE_LIMIT) throw new Error('파일이 커서 저장할 수 없어요 (Firebase Storage를 활성화하면 큰 파일도 가능)');
    return src;
  }

  const n = parseInt(hex.slice(1), 16), f = (v) => Math.max(0, Math.round(v * (1 - amt)));
  return '#' + (((f(n >> 16)) << 16) | ((f((n >> 8) & 255)) << 8) | f(n & 255)).toString(16).padStart(6, '0');
}

function normalizeUrl(s) { s = s.trim(); if (!s) return null; if (!/^https?:\/\//i.test(s)) s = 'https://' + s; try { new URL(s); return s; } catch { return null; } }

function renderMeta() { $('#boardMeta').textContent = `${state.posts.length}공용 • ${timeAgo(state.createdAt)}`; }

function applyDesign() {
  const s = state.settings, root = document.documentElement;
  root.style.setProperty('--bg', state.bg);
  root.style.setProperty('--bg-deep', darken(state.bg));
  root.style.setProperty('--pw', s.size === 'wide' ? '380px' : '284px');
  root.classList.toggle('dark', s.scheme === 'dark');
  document.body.style.fontFamily = FONTS[s.font]?.stack || FONTS[0].stack;
  document.body.style.backgroundImage = state.bgImage ? `url(${state.bgImage})` : '';
  document.body.classList.toggle('has-image', !!state.bgImage);
}

function sortedPosts(list) {
  const s = state.settings.sort;
  const score = (p) => (p.likes || 0) + (p.up || 0) + Object.values(p.reactions || {}).reduce((a, b) => a + b, 0);
  return [...list].sort((a, b) =>
    s === 'newest' ? b.createdAt - a.createdAt : s === 'oldest' ? a.createdAt - b.createdAt : s === 'likes' ? score(b) - score(a) : a.order - b.order);
}
const matches = (p) => { const q = searchQuery.trim().toLowerCase(); return !q || (p.title + ' ' + p.body).toLowerCase().includes(q); };

function render() {
  applyDesign();
  if (document.activeElement !== $('#boardTitle')) $('#boardTitle').textContent = state.title;
  $('#boardIcon').textContent = state.settings.icon || '';
  $('#boardDesc').textContent = state.settings.desc || '';
  renderMeta();

  const inner = $('#boardInner'); inner.innerHTML = '';
  if (state.settings.layout === 'column') renderColumns(inner); else renderFlow(inner);
}

function renderColumns(inner) {
  const wrap = document.createElement('div'); wrap.className = 'sections'; inner.appendChild(wrap);
  state.sections.forEach((sec) => {
    const el = document.createElement('div');
    el.className = 'section'; el.dataset.id = sec.id;
    el.innerHTML = `
      <div class="section-head">
        <div class="section-name" contenteditable="true" spellcheck="false">${esc(sec.name)}</div>
        <button class="icon-btn section-menu" title="섹션 메뉴">${I.dots}</button>
      </div>
      <button class="section-add" title="게시물 추가">${I.plus}</button>
      <div class="posts"></div>`;
    const postsEl = el.querySelector('.posts');
    sortedPosts(state.posts.filter((p) => p.sectionId === sec.id).filter(matches)).forEach((p) => postsEl.appendChild(renderPost(p)));

    const nameEl = el.querySelector('.section-name');
    nameEl.addEventListener('blur', () => { const v = nameEl.textContent.trim() || sec.name; if (v !== sec.name) { sec.name = v; persist(); } nameEl.textContent = v; });
    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
    el.querySelector('.section-menu').addEventListener('click', (e) => openSectionMenu(e, sec.id));
    el.querySelector('.section-add').addEventListener('click', () => openComposer({ sectionId: sec.id }));
    [postsEl, el.querySelector('.section-head')].forEach((zone) => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('over'));
      zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) movePost(id, sec.id, null); });
    });
    wrap.appendChild(el);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'new-section'; addBtn.textContent = '섹션 추가';
  addBtn.addEventListener('click', addSection);
  wrap.appendChild(addBtn);
}

function renderFlow(inner) {
  const flow = document.createElement('div'); flow.className = `flow layout-${state.settings.layout}`; inner.appendChild(flow);
  const all = state.settings.sort === 'manual'
    ? state.sections.flatMap((s) => sortedPosts(state.posts.filter((p) => p.sectionId === s.id)))
    : sortedPosts(state.posts);
  all.filter(matches).forEach((p) => {
    const el = renderPost(p);
    if (state.sections.length > 1) { const tag = document.createElement('div'); tag.className = 'sec-tag'; tag.textContent = state.sections.find((s) => s.id === p.sectionId)?.name || ''; el.prepend(tag); }
    flow.appendChild(el);
  });
  if (!all.length) flow.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px">아직 게시물이 없어요</div>';
}

/* 첨부 렌더 */
function renderAttachment(a, opts = {}) {
  if (!a) return '';
  switch (a.type) {
    case 'image': return `<div class="att"><img src="${a.src}" alt="" draggable="false"></div>`;
    case 'video': return `<div class="att"><video src="${a.src}" controls playsinline></video></div>`;
    case 'audio': return `<div class="att"><audio src="${a.src}" controls></audio></div>`;
    case 'file': return `<div class="att"><a class="att-file" href="${a.src}" download="${esc(a.name)}"><div class="ic">${I.file}</div><div class="u"><b>${esc(a.name)}</b><span>${fmtSize(a.size)}</span></div></a></div>`;
    case 'link': return `<div class="att"><a class="att-link" href="${esc(a.url)}" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=${esc(hostOf(a.url))}&sz=64" alt=""><div class="u"><b>${esc(hostOf(a.url))}</b><span>${esc(a.url)}</span></div></a></div>`;
    case 'youtube': return `<div class="att att-embed yt" data-yt="${a.id}"><img src="https://img.youtube.com/vi/${a.id}/hqdefault.jpg" alt="" draggable="false"><button class="yt-play" title="재생">${I.youtube}</button></div>
        <div class="att-caption"><a href="${esc(a.url)}" target="_blank" rel="noopener">YouTube에서 열기 ↗</a></div>`;
    case 'spotify': return `<div class="att att-spotify"><iframe src="https://open.spotify.com/embed/${a.path}" allow="encrypted-media" loading="lazy"></iframe></div>`;
    case 'location': {
      const d = 0.008, bbox = [a.lon - d, a.lat - d / 2, a.lon + d, a.lat + d / 2].join(',');
      return `<div class="att att-map"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${a.lat},${a.lon}" loading="lazy"></iframe><div class="att-caption">${I.location}<span>${esc(a.name)}</span></div></div>`;
    }
    case 'poll': {
      const total = a.options.reduce((s, o) => s + o.votes, 0);
      return `<div class="att"><div class="poll">${a.options.map((o, i) => {
        const pct = total ? Math.round((o.votes / total) * 100) : 0;
        const mine = opts.postId && myFlag(opts.postId).poll === i;
        return `<button class="poll-opt ${mine ? 'mine' : ''}" data-i="${i}" ${opts.postId ? '' : 'disabled'}><div class="bar" style="transform:scaleX(${pct / 100})"></div><div class="lbl"><span>${esc(o.text)}</span><span>${total ? pct + '%' : ''}</span></div></button>`;
      }).join('')}<div class="poll-total">${total}표</div></div></div>`;
    }
  }
  return '';
}

function reactionButtons(p) {
  const m = state.settings.reactions, f = myFlag(p.id);
  if (m === 'none') return '';
  if (m === 'like') return `<button class="like ${f.liked ? 'liked' : ''}" title="좋아요">${I.heart}${p.likes || ''}</button>`;
  if (m === 'vote') return `<button class="vote ${f.vote === 'up' ? 'mine' : ''}" data-v="up">👍 ${p.up || ''}</button><button class="vote ${f.vote === 'down' ? 'mine' : ''}" data-v="down">👎 ${p.down || ''}</button>`;
  const rx = p.reactions || {};
  return Object.entries(rx).filter(([, n]) => n > 0).map(([e, n]) => `<button class="rx ${f.reaction === e ? 'mine' : ''}" data-e="${e}">${e} ${n}</button>`).join('')
    + `<button class="rx-add" title="반응 추가">${I.smile}</button>`;
}

function renderPost(p) {
  const s = state.settings, dark = s.scheme === 'dark', manual = s.sort === 'manual';
  const el = document.createElement('article');
  el.className = 'post' + (p.approved === false ? ' pending' : '') + (s.copyProtect === 'on' ? ' noselect' : '');

    ${renderAttachment(p.attachment, { postId: p.id })}
    ${p.title || p.body ? `<div class="post-body">${p.title ? `<div class="post-title">${esc(p.title)}</div>` : ''}${p.body ? `<div class="post-text">${esc(p.body)}</div>` : ''}</div>` : '<div style="height:8px"></div>'}
    <div class="post-footer">
      <span>${s.showAuthor ? `${esc(p.author || '익명')} • ${timeAgo(p.createdAt)}` : ''}</span>
      <div class="post-actions">
        ${reactionButtons(p)}
        ${s.comments ? `<button class="comment-toggle" title="댓글">${I.comment}${p.comments.length || ''}</button>` : ''}
      </div>
    </div>
    ${s.comments ? `<div class="comments">
      ${p.comments.map((c) => `<div class="comment">${s.commentAuthor ? `<b>${esc(c.author)}</b>` : ''}${esc(c.text)}${s.commentAuthor ? `<span class="ts">${timeAgo(c.createdAt)}</span>` : ''}</div>`).join('')}
      <form class="comment-form"><input type="text" placeholder="댓글 추가..." maxlength="300"><button type="submit">게시</button></form>
    </div>` : ''}
    <button class="post-menu-btn" title="메뉴">${I.dots}</button>`;

  const on = (sel, ev, fn) => el.querySelectorAll(sel).forEach((n) => n.addEventListener(ev, fn));
  on('.approve', 'click', () => { delete p.approved; persist(); render(); });
  on('.rej', 'click', () => { state.posts = state.posts.filter((x) => x.id !== p.id); persist(); render(); });
  const f = myFlag(p.id);
  on('.like', 'click', () => { f.liked = !f.liked; p.likes = Math.max(0, (p.likes || 0) + (f.liked ? 1 : -1)); saveMe(); persist(); render(); });
  on('.vote', 'click', (e) => {
    const v = e.currentTarget.dataset.v;
    if (f.vote) p[f.vote] = Math.max(0, (p[f.vote] || 0) - 1);
    if (f.vote === v) f.vote = null; else { f.vote = v; p[v] = (p[v] || 0) + 1; }
    saveMe(); persist(); render();
  });
  const react = (e) => {
    p.reactions = p.reactions || {};
    if (f.reaction) p.reactions[f.reaction] = Math.max(0, (p.reactions[f.reaction] || 0) - 1);
    if (f.reaction === e) f.reaction = null; else { f.reaction = e; p.reactions[e] = (p.reactions[e] || 0) + 1; }
    saveMe(); persist(); render();
  };
  on('.rx', 'click', (e) => react(e.currentTarget.dataset.e));
  on('.rx-add', 'click', (e) => openMenu(e, EMOJIS.map((em) => ({ label: em, action: () => react(em) })), { row: true }));
  on('.comment-toggle', 'click', () => el.querySelector('.comments').classList.toggle('open'));
  on('.comment-form', 'submit', (e) => {
    e.preventDefault();
    const text = e.target.querySelector('input').value.trim(); if (!text) return;
    p.comments.push({ id: uid(), author: ensureName(), text, createdAt: Date.now() });
    persist(); render();
    document.querySelector(`.post[data-id="${p.id}"] .comments`)?.classList.add('open');
  });
  on('.poll-opt', 'click', (e) => {
    const i = +e.currentTarget.dataset.i, a = p.attachment;
    if (f.poll === i) return;
    if (f.poll != null && a.options[f.poll]) a.options[f.poll].votes = Math.max(0, a.options[f.poll].votes - 1);
    a.options[i].votes++; f.poll = i; saveMe(); persist(); render();
  });
  on('.post-menu-btn', 'click', (e) => openPostMenu(e, p.id));

  if (manual) {
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', p.id); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => el.classList.add('dragging'), 0); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('drop-before'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop-before'));
    el.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('drop-before'); const id = e.dataTransfer.getData('text/plain'); if (id && id !== p.id) movePost(id, p.sectionId, p.id); });
  }
  return el;
}

function reorderSection(sid) { state.posts.filter((p) => p.sectionId === sid).sort((a, b) => a.order - b.order).forEach((p, i) => (p.order = i)); }
function movePost(id, toSid, beforeId) {

const menu = $('#menu');
function openMenu(e, items, opts = {}) {
  menu.innerHTML = ''; menu.classList.toggle('row', !!opts.row);

    if (it === '-') { menu.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button');
    b.innerHTML = (it.html || '') + esc(it.label);
    if (it.danger) b.classList.add('danger'); if (it.on) b.classList.add('on');
    b.addEventListener('click', () => { closeMenu(); it.action(); });
    menu.appendChild(b);
  });
  menu.classList.add('open');
  const r = e.currentTarget.getBoundingClientRect();
  let x = r.left, y = r.bottom + 4;
  if (x + menu.offsetWidth > innerWidth - 8) x = innerWidth - menu.offsetWidth - 8;
  if (y + menu.offsetHeight > innerHeight - 8) y = r.top - menu.offsetHeight - 4;
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  e.stopPropagation();
}

async function submitPost() {
  const title = $('#postTitle').value.trim(), body = $('#postBody').value.trim();
  if (!title && !body && !attachment) return toast('내용을 입력해주세요');
  const btn = $('#composerSubmit');
  if (btn.disabled) return;
  const author = ensureName();
  // data: URL 첨부는 저장소에 올리고 URL로 바꿈 (Storage → 압축 인라인 순)
  if (attachment?.src?.startsWith('data:')) {
    btn.disabled = true; btn.textContent = '업로드 중...';
    try { attachment = { ...attachment, src: await store.uploadFile(attachment.src, attachment.name || attachment.type, attachment.mime || '') }; }
    catch (e) { toast(e.message); btn.disabled = false; btn.textContent = editing ? '저장' : '게시'; return; }
  }
  if (editing) {
    const p = state.posts.find((x) => x.id === editing);
    const moved = p.sectionId !== selectedSection;
    Object.assign(p, { title, body, color: selectedColor, attachment, updatedAt: Date.now() });
    if (moved) movePost(p.id, selectedSection, null);
  } else {
    const inSec = state.posts.filter((p) => p.sectionId === selectedSection);
    const post = { id: uid(), sectionId: selectedSection, title, body, color: selectedColor, attachment, author, likes: 0, comments: [], reactions: {}, createdAt: Date.now(), order: state.newPos === 'top' ? -1 : inSec.length };
    if (state.settings.moderation === 'manual') post.approved = false;
    state.posts.push(post); reorderSection(selectedSection);
    if (post.approved === false) toast('콘텐츠 검토가 수동이라 승인 대기 상태로 게시됐어요');
  }
  persist(); render(); closeComposer();
}

const MAX_FILE = 4 * 1024 * 1024;
async function attachFile(f) {
  if (!f) return;
  if (f.size > MAX_FILE) return toast('브라우저 저장 단계에서는 4MB 이하만 첨부할 수 있어요');
  const src = await readFile(f);
  const kind = f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : f.type.startsWith('audio/') ? 'audio' : 'file';
  setAttachment({ type: kind, src, name: f.name, size: f.size, mime: f.type }); closeToolPanel();
}
function toolUpload() {
  const b = openToolPanel('업로드', `<label class="tp-upload">${I.upload}<div>클릭하거나 파일을 여기에 끌어다 놓으세요</div><div class="tp-note" style="margin-top:6px">이미지 · 비디오 · 오디오 · 기타 파일 (4MB 이하)</div><input type="file" hidden id="upInput"></label>`);
  b.querySelector('#upInput').addEventListener('change', (e) => attachFile(e.target.files[0]));
  const zone = b.querySelector('.tp-upload');
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.background = '#f0f0f4'; });
  zone.addEventListener('dragleave', () => (zone.style.background = ''));
  zone.addEventListener('drop', (e) => { e.preventDefault(); attachFile(e.dataTransfer.files[0]); });

async function toolRecorder(kind) {
  const titles = { video: '비디오 레코더', audio: '오디오 레코더', screen: '화면 녹화' };

    <div id="recResult" style="display:none">${kind === 'audio' ? '<audio id="recPlay" controls style="width:100%"></audio>' : '<video id="recPlay" class="tp-video" controls></video>'}
      <div class="tp-row" style="margin-top:8px"><button class="btn primary" id="recUse">첨부하기</button><button class="btn ghost" id="recRetry">다시 녹화</button></div></div>`);
  try {
    activeStream = kind === 'screen' ? await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }) : await navigator.mediaDevices.getUserMedia({ video: kind === 'video', audio: true });
  } catch (e) { b.innerHTML = `<div class="tp-note">장치를 열 수 없어요 (${e.name}). 권한을 허용했는지 확인해주세요.</div>`; return; }
  if (kind !== 'audio') b.querySelector('#recView').srcObject = activeStream; else b.querySelector('.tp-video').textContent = '🎙️ 마이크 준비 완료';
  let rec, chunks = [], blob = null, timer, t0;
  const $s = (id) => b.querySelector('#' + id);
  $s('recStart').addEventListener('click', () => {
    chunks = []; rec = new MediaRecorder(activeStream);
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => { blob = new Blob(chunks, { type: rec.mimeType }); $s('recPlay').src = URL.createObjectURL(blob); $s('recResult').style.display = ''; $s('recState').textContent = fmtSize(blob.size); };
    rec.start(200); t0 = Date.now();
    $s('recStart').style.display = 'none'; $s('recStop').style.display = ''; $s('recState').className = 'tp-rec';
    timer = setInterval(() => ($s('recState').textContent = `${Math.floor((Date.now() - t0) / 1000)}초`), 500);
  });
  $s('recStop').addEventListener('click', () => { rec.stop(); clearInterval(timer); $s('recStop').style.display = 'none'; $s('recState').className = 'tp-note'; });
  $s('recRetry').addEventListener('click', () => { $s('recResult').style.display = 'none'; $s('recStart').style.display = ''; });
  $s('recUse').addEventListener('click', async () => {
    if (blob.size > MAX_FILE) toast('4MB를 넘어 브라우저 저장이 안 될 수 있어요 (SDK 연결 후 해결)');
    setAttachment({ type: kind === 'audio' ? 'audio' : 'video', src: await readFile(blob), mime: blob.type, size: blob.size, name: `${kind}.webm` }); closeToolPanel();
  });
  activeStream.getVideoTracks()[0]?.addEventListener('ended', () => { if (rec?.state === 'recording') $s('recStop').click(); });
}
function toolDraw() {
  const colors = ['#222222', '#e63946', '#f4a261', '#ffe83d', '#2a9d8f', '#1d6fd6', '#7c3aed', '#ffffff'];
  const b = openToolPanel('그리기', `<canvas class="tp-canvas" id="drawCv" width="800" height="600"></canvas>
    <div class="tp-row"><div class="colors" id="drawColors"></div><input type="range" id="drawSize" min="2" max="30" value="6" style="width:100px"><button class="btn ghost" id="drawClear">지우기</button><button class="btn primary" id="drawDone" style="margin-left:auto">완료</button></div>`);
  const cv = b.querySelector('#drawCv'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.lineCap = ctx.lineJoin = 'round';
  let color = colors[0], drawing = false;
  const pal = b.querySelector('#drawColors');
  const paint = () => { pal.innerHTML = colors.map((c) => `<div class="color ${c === color ? 'selected' : ''}" style="background:${c};${c === '#ffffff' ? 'border:2px solid #ddd' : ''}" data-c="${c}"></div>`).join(''); };
  paint();
  pal.addEventListener('click', (e) => { if (e.target.dataset.c) { color = e.target.dataset.c; paint(); } });
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', (e) => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; ctx.strokeStyle = color; ctx.lineWidth = +b.querySelector('#drawSize').value; ctx.lineTo(...pos(e)); ctx.stroke(); });
  cv.addEventListener('pointerup', () => (drawing = false));
  b.querySelector('#drawClear').addEventListener('click', () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); });
  b.querySelector('#drawDone').addEventListener('click', () => { setAttachment({ type: 'image', src: cv.toDataURL('image/png'), name: 'drawing.png' }); closeToolPanel(); });
}

['settingsBody', 'shareBody'].forEach((id) => {

  body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-set],[data-dd],[data-tg],[data-action]'); if (!t) return;
    if (t.dataset.set) { setPath(t.dataset.set, isNaN(t.dataset.val) ? t.dataset.val : +t.dataset.val); persist(); render(); rerender(); }
    else if (t.dataset.tg) { setPath(t.dataset.tg, !getPath(t.dataset.tg)); persist(); render(); rerender(); }
    else if (t.dataset.dd) {
      const path = t.dataset.dd, opts = DD_OPTS[path];
      openMenu(e, opts.map(([v, l]) => ({ label: l, on: getPath(path) === v, action: () => { setPath(path, v); persist(); render(); rerender(); } })));
    }
    else if (t.dataset.action) ACTIONS[t.dataset.action]?.(t);
  });
  body.addEventListener('change', (e) => { const f = e.target.dataset.field; if (f) { setPath(f, e.target.value.trim()); persist(); render(); } });
  body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.field) e.target.blur(); });

      <button class="row" data-action="password"><div class="t">비밀번호 필수</div><div class="r">${sh.password ? '켬' : '끔'}<span class="chev">›</span></div></button>
      <div class="row"><div class="t">방문자가 로그인해야 함</div>${tg('share.loginRequired', sh.loginRequired)}</div>
      <div class="row"><div class="t">프로필 및 웹에 게시</div>${tg('share.publishProfile', sh.publishProfile)}</div>
    </div>
    <div class="list" style="margin-top:12px">
      <button data-action="copylink">${I.link}보드 링크 복사</button>
      <button data-action="qr">${I.qr}QR 코드</button>
      <button data-action="rooms">${I.rooms}소회의실<span class="chev">›</span></button>
      <button data-action="form">${I.form}제출 양식<span class="chev">›</span></button>
      <button data-action="remake">${I.copy}자동 복제 링크<span class="chev">›</span></button>
      <button data-action="embed">${I.embed}블로그 또는 웹사이트에 삽입하기<span class="chev">›</span></button>
      <button data-action="native">${I.share}다른 앱으로 공유하기<span class="chev">›</span></button>
    </div>
    <div class="g-label">내보내기${cp ? ' <span style="color:#d6336c">(복사 방지 켜짐)</span>' : ''}</div>
    <div class="list">
      <button data-action="image" ${cp ? 'disabled' : ''}>${I.image}이미지로 내보내기<span class="chev">›</span></button>
      <button data-action="pdf" ${cp ? 'disabled' : ''}>${I.pdf}PDF로 내보내기<span class="chev">›</span></button>
      <button data-action="csv" ${cp ? 'disabled' : ''}>${I.csv}CSV로 내보내기</button>
      <button data-action="xls" ${cp ? 'disabled' : ''}>${I.xls}Excel 스프레드시트로 내보내기</button>
      <button disabled>${I.dl}모든 파일 다운로드</button>
      <button data-action="print" ${cp ? 'disabled' : ''}>${I.print}인쇄</button>
    </div>`;
}

/* ---------------- 드로어 액션 ---------------- */
const ACTIONS = {
  icon() {
    const b = openToolPanel('아이콘', `<div class="emoji-grid">${['', ...ICONS].map((e) => `<button data-e="${e}" class="${state.settings.icon === e ? 'on' : ''}" title="${e ? '' : '없음'}">${e || '∅'}</button>`).join('')}</div>`);
    b.querySelectorAll('button').forEach((bt) => bt.addEventListener('click', () => { state.settings.icon = bt.dataset.e; persist(); render(); renderSettings(); closeToolPanel(); }));
  },
  bg() {
    const b = openToolPanel('배경 화면', `
      <label>색상</label><div class="bg-grid">${BG_COLORS.map((c) => `<div style="background:${c}" data-c="${c}" class="${!state.bgImage && state.bg === c ? 'selected' : ''}"></div>`).join('')}</div>
      <label style="margin-top:8px">이미지</label>
      <div class="tp-row"><label class="btn ghost" style="cursor:pointer">이미지 업로드<input type="file" accept="image/*" hidden id="bgFile"></label>${state.bgImage ? '<button class="btn ghost" id="bgClear">이미지 제거</button>' : ''}</div>
      <div class="tp-note">이미지는 2MB 이하를 권장해요 (브라우저 저장 용량).</div>`);
    b.querySelectorAll('[data-c]').forEach((d) => d.addEventListener('click', () => { state.bg = d.dataset.c; state.bgImage = null; persist(); render(); renderSettings(); closeToolPanel(); }));
    b.querySelector('#bgFile').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 4 * 1024 * 1024) return toast('4MB 이하 이미지를 사용해주세요');
      try { state.bgImage = await store.uploadFile(await readFile(f), 'bg-' + f.name, f.type); }
      catch (err) { return toast(err.message); }
      persist(); render(); renderSettings(); closeToolPanel();
    });
    b.querySelector('#bgClear')?.addEventListener('click', () => { state.bgImage = null; persist(); render(); renderSettings(); closeToolPanel(); });
  },
  fields() { toast('게시물 필드 편집은 준비 중이에요'); },
  comments() { state.settings.comments = !state.settings.comments; persist(); render(); renderSettings(); },
  copyurl() { copyText(boardUrl(), 'URL을 복사했어요 (실제 링크 생성은 DB 연결 후)'); },
  copylink() { copyText(location.href, '보드 링크를 복사했어요'); },
  qr() {
    const u = encodeURIComponent(location.href);
    openToolPanel('QR 코드', `<img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${u}" alt="QR" style="display:block;margin:0 auto;border-radius:8px" width="260" height="260">
      <div class="tp-note" style="text-align:center">이 보드의 현재 주소(${esc(location.href.slice(0, 60))}…)를 가리켜요.<br>실제 공개 링크는 DB 연결 후 생성돼요.</div>`);
  },
  rooms() { toast('소회의실은 링크 생성(DB 연결) 후 지원돼요'); },
  form() { toast('제출 양식 링크는 DB 연결 후 지원돼요'); },
  remake() { toast('자동 복제 링크는 DB 연결 후 지원돼요'); },
  embed() {
    const code = `<div style="border:1px solid rgba(0,0,0,.1);border-radius:8px;overflow:hidden"><iframe src="${location.href}" width="100%" height="608" style="border:0;display:block" allow="camera;microphone;geolocation"></iframe></div>`;
    const b = openToolPanel('삽입', `<div class="tp-note">블로그나 웹사이트의 HTML에 붙여넣으세요.</div><div class="code">${esc(code)}</div><button class="btn primary" id="embCopy">코드 복사</button>`);
    b.querySelector('#embCopy').addEventListener('click', () => copyText(code, '삽입 코드를 복사했어요'));
  },
  async native() {
    if (navigator.share) { try { await navigator.share({ title: state.title, text: state.settings.desc, url: location.href }); } catch {} }
    else copyText(location.href, '이 브라우저는 공유 시트를 지원하지 않아 링크를 복사했어요');
  },
  invite() {
    const inp = $('#collabInput'), v = inp.value.trim(); if (!v) return inp.focus();
    state.share.collaborators.push(v); persist(); renderShare(); toast('초대 메일 발송은 DB/인증 연결 후 지원돼요 — 목록에만 추가했어요');
  },
  uninvite(t) { state.share.collaborators.splice(+t.dataset.i, 1); persist(); renderShare(); },
  password() {
    const b = openToolPanel('비밀번호 필수', `<div class="tp-note">방문자가 보드를 열 때 입력해야 하는 비밀번호예요. (검증은 DB 연결 후 동작)</div>
      <input type="password" id="pwInput" placeholder="비밀번호" value="${esc(state.share.password)}">
      <div class="tp-row"><button class="btn primary" id="pwSave">저장</button>${state.share.password ? '<button class="btn ghost" id="pwOff">끄기</button>' : ''}</div>`);
    b.querySelector('#pwSave').addEventListener('click', () => { state.share.password = b.querySelector('#pwInput').value; persist(); renderShare(); closeToolPanel(); });
    b.querySelector('#pwOff')?.addEventListener('click', () => { state.share.password = ''; persist(); renderShare(); closeToolPanel(); });
  },
  pdf() { closeDrawer('shareDrawer'); setTimeout(() => window.print(), 200); },
  print() { closeDrawer('shareDrawer'); setTimeout(() => window.print(), 200); },
  csv() { download(`${state.title}.csv`, '﻿' + exportRows().map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n'), 'text/csv;charset=utf-8'); },
  xls() { download(`${state.title}.xls`, '﻿' + exportRows().map((r) => r.map((c) => String(c).replace(/\t|\r?\n/g, ' ')).join('\t')).join('\r\n'), 'application/vnd.ms-excel;charset=utf-8'); },
  async image() {
    toast('이미지 생성 중...');
    try {
      if (!window.html2canvas) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      closeDrawer('shareDrawer');
      const target = $('#boardInner');
      const canvas = await html2canvas(target, { backgroundColor: state.bg, useCORS: true, scale: 2, width: target.scrollWidth, height: target.scrollHeight });
      canvas.toBlob((blob) => download(`${state.title}.png`, blob));
    } catch (e) { toast('이미지 내보내기에 실패했어요 (네트워크 또는 외부 이미지 문제)'); }
  },
};
function exportRows() {
  const secName = (id) => state.sections.find((s) => s.id === id)?.name || '';
  const attText = (a) => !a ? '' : a.type === 'link' || a.type === 'youtube' || a.type === 'spotify' ? a.url : a.type === 'location' ? `${a.name} (${a.lat},${a.lon})` : a.type === 'poll' ? a.options.map((o) => `${o.text}:${o.votes}`).join(' / ') : a.name || a.type;
  return [['섹션', '제목', '본문', '첨부 유형', '첨부', '작성자', '작성일', '반응', '댓글 수', '댓글'],
    ...state.sections.flatMap((s) => sortedPosts(state.posts.filter((p) => p.sectionId === s.id)).map((p) => [
      s.name, p.title, p.body, p.attachment?.type || '', attText(p.attachment), p.author || '', new Date(p.createdAt).toLocaleString('ko-KR'),
      (p.likes || 0) + (p.up || 0) + Object.values(p.reactions || {}).reduce((a, b) => a + b, 0), p.comments.length, p.comments.map((c) => `${c.author}: ${c.text}`).join(' | '),
    ]))];
}

/* ---------------- 보드 제목 / 검색 / 기타 ---------------- */
const titleEl = $('#boardTitle');
titleEl.addEventListener('blur', () => { const v = titleEl.textContent.trim() || state.title; titleEl.textContent = v; if (v !== state.title) { state.title = v; persist(); } });
titleEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } });
$('#searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
function importJSON() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.sections || !d.posts) throw 0; state = migrate(d); persist(); render(); toast('가져왔어요'); } catch { toast('올바른 파일이 아니에요'); } };
    r.readAsText(f);
  };
  input.click();
}

/* ---------------- 슬라이드쇼 ---------------- */
let slideIdx = 0, slideList = [];
function openSlideshow() { slideList = state.sections.flatMap((s) => sortedPosts(state.posts.filter((p) => p.sectionId === s.id))); if (!slideList.length) return toast('게시물이 없어요'); slideIdx = 0; renderSlide(); $('#slideshow').classList.add('open'); }
function closeSlideshow() { $('#slideshow').classList.remove('open'); $('#slide').innerHTML = ''; }
function renderSlide() {
  const p = slideList[slideIdx];
  $('#slide').style.background = state.settings.scheme === 'dark' ? '' : (p.color || '#fff');
  $('#slide').innerHTML = `${renderAttachment(p.attachment)}<div class="slide-body">${p.title ? `<div class="slide-title">${esc(p.title)}</div>` : ''}${p.body ? `<div class="slide-text">${esc(p.body)}</div>` : ''}</div>`;
  $('#slideCounter').textContent = `${slideIdx + 1} / ${slideList.length}`;
}
$('#slideshowBtn').addEventListener('click', openSlideshow);
$('#slideClose').addEventListener('click', closeSlideshow);
$('#slidePrev').addEventListener('click', () => { slideIdx = (slideIdx - 1 + slideList.length) % slideList.length; renderSlide(); });
$('#slideNext').addEventListener('click', () => { slideIdx = (slideIdx + 1) % slideList.length; renderSlide(); });
document.addEventListener('keydown', (e) => { if (!$('#slideshow').classList.contains('open')) return; if (e.key === 'ArrowRight') $('#slideNext').click(); if (e.key === 'ArrowLeft') $('#slidePrev').click(); });
$('#fab').addEventListener('click', () => openComposer());
$('#avatarBtn').addEventListener('click', () => {
  const v = prompt('게시물에 표시할 이름', me.name || ''); if (v === null) return;
  me.name = v.trim() || '익명'; saveMe(); toast(`이름: ${me.name}`);
});

/* ---------------- 시작 ---------------- */
function migrate(s) {
  const d = defaultState();
  s = { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) }, share: { ...d.share, ...(s.share || {}) } };
  s.posts.forEach((p) => { if (p.image && !p.attachment) { p.attachment = { type: 'image', src: p.image }; delete p.image; } p.comments ||= []; p.reactions ||= {}; });
  return s;
}
function setStatus(kind, text) {
  const el = $('#status'); el.className = 'status ' + kind; el.textContent = text;
}
(async () => {
  let saved = null;
  if (store.realtime) {
    setStatus('wait', '연결 중…');
    try {
      saved = await store.init((remote) => {
        if (!remote) return;
        state = migrate(remote); store.remember(state); safeRender();
      });
      setStatus('live', '● 실시간');
    } catch (e) {
      console.error(e);
      setStatus('off', '● 로컬 (연결 실패)');
      toast('Firebase 연결 실패 — 로컬 저장으로 동작해요. Firestore 데이터베이스/규칙을 확인하세요 (' + (e.code || e.message) + ')');
      store = new LocalStore('jadlet-v1'); saved = await store.init();
    }
  } else {
    setStatus('off', '● 로컬');
    saved = await store.init();
  }
  if (saved) { state = migrate(saved); store.remember(state); }
  else if (store.realtime) { state.id = BOARD_ID; await persist(); }   // 보드 문서 생성
  render();
  setInterval(renderMeta, 30000);
})();
</script>
